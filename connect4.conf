map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name connect4.oraclelee.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name connect4.oraclelee.com;

    ssl_certificate /etc/letsencrypt/live/connect4.oraclelee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect4.oraclelee.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/connect4_access.log;
    error_log /var/log/nginx/connect4_error.log;

    location / {
        proxy_pass http://127.0.0.1:55555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
