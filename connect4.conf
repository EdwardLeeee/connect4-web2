map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name connect4.oraclelee.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name connect4.oraclelee.com;

    ssl_certificate /etc/letsencrypt/live/connect4.oraclelee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect4.oraclelee.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/connect4_access.log;
    error_log /var/log/nginx/connect4_error.log;

    location / {
        proxy_pass http://127.0.0.1:55555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# connect4-app.oraclelee.com: the "open in the app" banner's host (docs/deploy.md). The
# FastAPI app answers it by Host: its own apple-app-site-association, and a 302 to the App
# Store for everything else. Its certificate is separate from connect4.oraclelee.com's, so a
# problem here cannot touch the game site. Add the port 80 block first, issue the
# certificate with `certbot certonly --webroot -w /var/www/certbot -d connect4-app.oraclelee.com`,
# then add the 443 block.
server {
    listen 80;
    server_name connect4-app.oraclelee.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name connect4-app.oraclelee.com;

    ssl_certificate /etc/letsencrypt/live/connect4-app.oraclelee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect4-app.oraclelee.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/connect4-app_access.log;
    error_log /var/log/nginx/connect4-app_error.log;

    # Before the proxy: the app would send a renewal check to the App Store.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        proxy_pass http://127.0.0.1:55555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
