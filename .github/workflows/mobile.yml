name: Mobile

# Builds the iOS and Android apps whenever something bundled into them changes.
# Not a required check: the path filter would leave unrelated pull requests waiting.
on:
  pull_request:
    paths:
      - "mobile/**"
      - "design/app-icon/**"
      - ".github/workflows/mobile*.yml"
      - "frontend/**"
      - "!frontend/e2e/**"
      - "!frontend/tests/**"
  workflow_dispatch:
    inputs:
      smoke:
        description: >-
          iOS simulator smoke test: online (production server), offline (unreachable server) and a
          fresh install in English, Chinese and Thai, plus the offline Android run. Pull requests run all but
          the online part.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_ORIGIN: https://connect4.oraclelee.com

jobs:
  # The App Store and Google Play files, without credentials: texts, screenshots, previews.
  # The dry run and the upload that need the App Store Connect key stay on the developer machine.
  store-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: python3 mobile/scripts/app_store_metadata.py --check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - run: npm run check:capacitor
        working-directory: mobile
      - run: npm audit --audit-level=high
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      # The unsigned release bundle proves the release build type still compiles.
      - run: ./gradlew assembleDebug bundleRelease
        working-directory: mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: connect4-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync ios
        working-directory: mobile
      - name: Build for the simulator
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project App.xcodeproj
          version="$(node -p "require('../../../frontend/package.json').version")"
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "${RUNNER_TEMP}/dd" \
            MARKETING_VERSION="${version}" CODE_SIGNING_ALLOWED=NO build
      - name: Check the built app
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/dd/Build/Products/Debug-iphonesimulator/App.app"
          version="$(node -p "require('./frontend/package.json').version")"
          value() { plutil -extract "$1" raw -o - "$2"; }
          fail() { echo "::error::$1"; exit 1; }
          [ "$(value CFBundleIdentifier "${app}/Info.plist")" = com.oraclelee.connect4 ] || fail "bundle id"
          [ "$(value CFBundleShortVersionString "${app}/Info.plist")" = "${version}" ] || fail "version"
          [ "$(value ITSAppUsesNonExemptEncryption "${app}/Info.plist")" = false ] || fail "export compliance key"
          [ "$(plutil -extract UIDeviceFamily json -o - "${app}/Info.plist")" = "[1]" ] || fail "iPhone only"
          [ "$(value CFBundleDisplayName "${app}/en.lproj/InfoPlist.strings")" = "Four In A Row" ] || fail "en name"
          [ "$(value CFBundleDisplayName "${app}/zh-Hant.lproj/InfoPlist.strings")" = "四子棋" ] || fail "zh-Hant name"
          [ "$(value CFBundleDisplayName "${app}/zh-Hans.lproj/InfoPlist.strings")" = "四子棋" ] || fail "zh-Hans name"
          [ "$(value CFBundleDisplayName "${app}/th.lproj/InfoPlist.strings")" = "เรียงสี่" ] || fail "th name"
          plutil -lint "${app}/PrivacyInfo.xcprivacy"
          [ -f "${app}/public/index.html" ] || fail "web bundle missing"
          echo "app bundle checks passed"
      - name: Build Release for devices without signing
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath "${RUNNER_TEMP}/dd-release" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      # Best effort: shows how the name and the app look on a simulator.
      - name: Simulator screenshots
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p screenshots
          udid="$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const phones = Object.entries(d).filter(([rt]) => rt.includes("iOS")).flatMap(([, list]) => list)
              .filter((x) => x.name.startsWith("iPhone"));
            console.log(phones.at(-1).udid);')"
          xcrun simctl boot "${udid}"
          xcrun simctl bootstatus "${udid}" -b
          xcrun simctl install "${udid}" "${RUNNER_TEMP}/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "${udid}" com.oraclelee.connect4
          sleep 10
          xcrun simctl io "${udid}" screenshot screenshots/app.png
          xcrun simctl terminate "${udid}" com.oraclelee.connect4
          sleep 3
          xcrun simctl io "${udid}" screenshot screenshots/home.png
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

  # The Android app on an emulator, offline only: Cloudflare blocks the Ubuntu runners from the
  # production site. Same triggers as the iOS smoke; not a required check.
  android-smoke:
    if: github.event_name == 'pull_request' || inputs.smoke
    runs-on: ubuntu-latest
    env:
      VITE_API_ORIGIN: https://offline.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: "Offline: lobby, rename, AI game, relaunch; three device languages"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash mobile/scripts/android-smoke.sh mobile/android/app/build/outputs/apk/debug/app-debug.apk android-smoke
      - name: Summary
        if: always()
        run: |
          { echo "### Android smoke"; grep -hE "^SMOKE |::error::" android-smoke/smoke.log 2>/dev/null \
              | sed 's/^/- /'; } >> "${GITHUB_STEP_SUMMARY}" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke-screenshots
          path: android-smoke/
          retention-days: 14
          if-no-files-found: ignore

  # Pull requests run the offline part and the three languages; the online part needs production
  # to run the version being tested, so it runs by hand here and in Mobile release.
  ios-smoke:
    if: github.event_name == 'pull_request' || inputs.smoke
    uses: ./.github/workflows/mobile-ios-smoke.yml
    with:
      online: ${{ github.event_name == 'workflow_dispatch' }}
      offline: true
