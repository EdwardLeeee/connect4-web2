name: Update screenshots

# Regenerates the e2e screenshot baselines on the same runner, fonts and browsers
# as CI's frontend job, and commits the ones that changed back to the branch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose baselines to update (not main)
        required: true
        type: string
      grep:
        description: Only tests whose title matches (optional)
        required: false
        type: string

permissions:
  contents: write
  # Starts CI on the branch afterwards (see the last step).
  actions: write

concurrency:
  group: update-screenshots-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    # Visual baselines are generated on Jammy, as in ci.yml; pin the same stack.
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse main
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ "${BRANCH}" = "main" ]; then
            echo "::error::baselines change through a pull request, never on main"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Visual baselines use the Black/Medium CJK weights, which live in -extra.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      # Only baselines that no longer match, or are missing, are rewritten. A
      # failure elsewhere still keeps the baselines that were updated; the run
      # is marked failed at the end.
      - name: Run e2e and update baselines
        id: e2e
        working-directory: frontend
        env:
          GREP: ${{ inputs.grep }}
        run: |
          set +e
          if [ -n "${GREP}" ]; then
            npx playwright test --update-snapshots=changed --grep "${GREP}"
          else
            npx playwright test --update-snapshots=changed
          fi
          echo "status=$?" >> "${GITHUB_OUTPUT}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit changed baselines
        id: commit
        env:
          BRANCH: ${{ inputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git add -A -- 'frontend/e2e/*-snapshots/*'
          if git diff --cached --quiet; then
            echo "No baseline changed."
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update e2e screenshot baselines" -m "Generated by ${RUN_URL}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "${GITHUB_OUTPUT}"
      # A push made with this workflow's token starts no workflow, so the pull
      # request's new head would have no checks. Start CI on the branch instead;
      # its backend, frontend and container results land on that commit.
      - name: Start CI on the branch
        if: steps.commit.outputs.pushed == 'true'
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${BRANCH}"
      - name: Fail if the tests failed
        if: steps.e2e.outputs.status != '0'
        env:
          STATUS: ${{ steps.e2e.outputs.status }}
        run: |
          echo "::error::playwright exited with ${STATUS}; the updated baselines were still committed"
          exit 1
