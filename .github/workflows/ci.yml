name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_solver
      # tests/test_api.py serves frontend/dist, so the API tests need a built frontend.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pip-audit
      - run: ruff check backend tests
      - run: pytest
      # Report-only until the pinned starlette/pytest/setuptools are bumped past the
      # advisories pip-audit found on 2026-09-25; the dependency PR removes this flag.
      - run: pip-audit
        continue-on-error: true
      - run: cargo fmt --manifest-path native_solver/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native_solver/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path native_solver/Cargo.toml
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file native_solver/Cargo.lock

  frontend:
    # Visual baselines are generated on Jammy; pin the renderer and font stack.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Visual baselines use the Black/Medium CJK weights, which live in -extra.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      # A failed screenshot comparison leaves actual, expected and diff images here.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  container:
    # Build and publish only what passed every test; a red job blocks release.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      # A release tag must match the version in both manifests, or nothing is built.
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          py="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          js="$(node -p "require('./frontend/package.json').version")"
          echo "tag=${expected} pyproject=${py} package.json=${js}"
          if [ "${py}" != "${expected}" ] || [ "${js}" != "${expected}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the manifest versions (use scripts/release.sh)"
            exit 1
          fi
      - run: >-
          docker build --file Containerfile --tag connect4-web:ci
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.version=${{ github.ref_name }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          .
      # Release tags (v*) publish the tested image to GHCR; the host then pulls it with
      # deploy/deploy.sh instead of rebuilding from source.
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/connect4-web"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag connect4-web:ci "${image}:${GITHUB_REF_NAME}"
          docker tag connect4-web:ci "${image}:latest"
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:latest"
      # A GitHub Release with auto-generated notes gives every version a readable changelog.
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Connect 4 ${GITHUB_REF_NAME#v}" --generate-notes
