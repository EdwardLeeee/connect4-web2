name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Visual baselines are generated on Jammy; pin the renderer and font stack.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo fmt --manifest-path native_solver/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native_solver/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path native_solver/Cargo.toml
      - run: ruff check backend tests
      - run: pytest
      # Visual baselines use the Black/Medium CJK weights, which live in -extra.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  container:
    # Build and publish only what passed every test; a red test job blocks release.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker build --file Containerfile --tag connect4-web:ci
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.version=${{ github.ref_name }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          .
      # Release tags (v*) publish the tested image to GHCR; the host then pulls it with
      # deploy/deploy.sh instead of rebuilding from source.
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/connect4-web"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag connect4-web:ci "${image}:${GITHUB_REF_NAME}"
          docker tag connect4-web:ci "${image}:latest"
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:latest"
