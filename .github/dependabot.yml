version: 2
updates:
  # frontend/ and mobile/ must pin the same Capacitor release (mobile/scripts/
  # check-capacitor-versions.mjs), so @capacitor/* is upgraded by hand in both at once.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@capacitor/*"
      # The app's on-device AI must be the server's engine version; it moves together with
      # native_solver's connect-four-ai and a regenerated reply table, by hand.
      - dependency-name: "connect-four-ai-wasm"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@capacitor/*"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /native_solver
    schedule:
      interval: weekly
    ignore:
      # Upgraded by hand with connect-four-ai-wasm and a regenerated reply table.
      - dependency-name: "connect-four-ai"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
